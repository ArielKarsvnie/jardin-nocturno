<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14110f">
  <meta name="color-scheme" content="dark">
  <title>Jardín nocturno</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Fraunces:opsz,wght,SOFT@9..144,400..700,100&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Cielo de fondo: estrellas + luciérnagas (decorativo) -->
  <div class="cielo" aria-hidden="true">
    <span class="luciernaga" style="--x:12%;--y:22%;--d:0s;--t:13s;--dx:40px;--dy:-50px"></span>
    <span class="luciernaga" style="--x:78%;--y:30%;--d:1.8s;--t:16s;--dx:-30px;--dy:-70px"></span>
    <span class="luciernaga" style="--x:40%;--y:58%;--d:3.1s;--t:12s;--dx:25px;--dy:-40px"></span>
    <span class="luciernaga" style="--x:88%;--y:66%;--d:.7s;--t:15s;--dx:-45px;--dy:-30px"></span>
    <span class="luciernaga" style="--x:20%;--y:80%;--d:2.4s;--t:14s;--dx:35px;--dy:-60px"></span>
    <span class="luciernaga" style="--x:60%;--y:14%;--d:4s;--t:17s;--dx:-20px;--dy:50px"></span>
    <span class="luciernaga" style="--x:52%;--y:86%;--d:1.2s;--t:13s;--dx:-30px;--dy:-55px"></span>
  </div>

  <header class="cabecera">
    <a class="marca" href="#jardin">
      <svg viewBox="0 0 40 48" aria-hidden="true"><use href="#ico-brote"/></svg>
      <span data-texto="sitio.titulo"></span>
    </a>
  </header>

  <main id="contenido">
    <section id="entrada" class="seccion seccion--entrada" data-seccion hidden aria-labelledby="t-entrada">
      <div class="entrada" data-modo="intro">
        <!-- La planta crece por etapas: 0 semilla, 1-3 tallo y hojas, 4 flor. js/entrada.js prende cada .parte -->
        <svg class="escena" data-escena viewBox="0 0 240 200" aria-hidden="true">
          <circle class="escena__luna" cx="188" cy="42" r="18"/>
          <circle class="escena__luna-sombra" cx="197" cy="35" r="16"/>
          <g class="escena__gotas">
            <path class="gota" d="M106 18c3 5 5 8 5 10.5a5 5 0 0 1-10 0c0-2.5 2-5.5 5-10.5Z"/>
            <path class="gota" d="M122 8c3 5 5 8 5 10.5a5 5 0 0 1-10 0c0-2.5 2-5.5 5-10.5Z"/>
            <path class="gota" d="M138 20c3 5 5 8 5 10.5a5 5 0 0 1-10 0c0-2.5 2-5.5 5-10.5Z"/>
          </g>
          <ellipse class="escena__tierra" cx="120" cy="184" rx="96" ry="18"/>
          <ellipse class="parte escena__semilla" data-desde="0" data-hasta="0" cx="120" cy="177" rx="7" ry="4.5"/>
          <g class="escena__planta">
            <path class="parte tallo" data-desde="1" d="M120 182 C120 174 120 167 121 158"/>
            <path class="parte hoja hoja--izq" data-desde="1" d="M121 164 C111 165 104 158 102 150 C112 149 119 155 121 164Z"/>
            <path class="parte hoja hoja--der" data-desde="1" d="M121 160 C131 158 138 151 139 143 C129 144 122 150 121 160Z"/>
            <path class="parte tallo" data-desde="2" d="M121 158 C122 142 118 128 120 112"/>
            <path class="parte hoja hoja--izq" data-desde="2" d="M120 136 C106 137 97 128 95 118 C108 117 118 125 120 136Z"/>
            <path class="parte hoja hoja--der" data-desde="2" d="M120 128 C133 126 142 117 144 106 C131 108 121 116 120 128Z"/>
            <path class="parte tallo" data-desde="3" d="M120 112 C121 99 119 88 120 76"/>
            <path class="parte hoja hoja--der" data-desde="3" d="M120 98 C129 97 135 91 136 84 C127 85 121 90 120 98Z"/>
            <ellipse class="parte pimpollo" data-desde="3" data-hasta="3" cx="120" cy="69" rx="6" ry="9"/>
            <g transform="translate(120 66)">
              <g class="parte parte--flor" data-desde="4">
                <use href="#flor-margarita" x="-30" y="-30" width="60" height="60"/>
              </g>
            </g>
          </g>
        </svg>
        <div class="petalos" data-petalos aria-hidden="true"></div>

        <!-- Pantalla 1: bienvenida -->
        <div class="entrada__pantalla" data-pantalla="intro">
          <p class="manuscrita entrada__saludo" data-solo="primera" data-texto="entrada.saludo"></p>
          <p class="manuscrita entrada__saludo" data-solo="vuelta" data-texto="entrada.saludoVuelta"></p>
          <h1 id="t-entrada" tabindex="-1" data-texto="entrada.titulo"></h1>
          <p class="entrada__texto" data-solo="primera" data-texto="entrada.texto"></p>
          <p class="entrada__texto" data-solo="vuelta" data-texto="entrada.textoVuelta"></p>
          <div class="entrada__botones">
            <button class="boton boton--primario" type="button" data-solo="primera" data-accion="plantar" data-texto="entrada.boton"></button>
            <button class="boton boton--primario" type="button" data-solo="vuelta" data-accion="entrar" data-texto="entrada.entrarDirecto"></button>
            <button class="boton boton--secundario" type="button" data-solo="vuelta" data-accion="plantar" data-texto="entrada.jugarDeNuevo"></button>
          </div>
          <p class="manuscrita nota" data-solo="primera" data-texto="entrada.nota"></p>
        </div>

        <!-- Pantalla 2: preguntas (salen de data/semilla.json) -->
        <div class="entrada__pantalla" data-pantalla="pregunta" hidden>
          <p class="manuscrita entrada__progreso" data-progreso></p>
          <h2 class="entrada__pregunta" tabindex="-1" data-pregunta></h2>
          <ul class="opciones" data-opciones></ul>
          <p class="entrada__reaccion manuscrita" data-reaccion aria-live="polite"></p>
          <button class="boton boton--primario" type="button" data-accion="siguiente" hidden></button>
        </div>

        <!-- Pantalla 3: brotó -->
        <div class="entrada__pantalla" data-pantalla="final" hidden>
          <h2 class="entrada__final" tabindex="-1" data-texto="semilla.final.titulo"></h2>
          <p class="entrada__texto" data-puntaje></p>
          <button class="boton boton--primario" type="button" data-accion="entrar" data-texto="semilla.final.boton"></button>
        </div>
      </div>
    </section>

    <section id="jardin" class="seccion" data-seccion hidden aria-labelledby="t-jardin">
      <header class="seccion__cabecera">
        <h1 id="t-jardin" tabindex="-1" data-texto="jardin.titulo"></h1>
        <p class="bajada" data-texto="jardin.bajada"></p>
      </header>
      <div data-jardin></div>
    </section>

    <section id="cartas" class="seccion" data-seccion hidden aria-labelledby="t-cartas">
      <header class="seccion__cabecera">
        <h1 id="t-cartas" tabindex="-1" data-texto="cartas.titulo"></h1>
        <p class="bajada" data-texto="cartas.bajada"></p>
      </header>
      <div data-cartas></div>
    </section>

    <section id="juegos" class="seccion" data-seccion hidden aria-labelledby="t-juegos">
      <header class="seccion__cabecera">
        <h1 id="t-juegos" tabindex="-1" data-texto="juegos.titulo"></h1>
        <p class="bajada" data-texto="juegos.bajada"></p>
      </header>
      <div data-juegos></div>
    </section>

    <footer class="pie">
      <p class="manuscrita" data-texto="sitio.pie"></p>
    </footer>
  </main>

  <nav class="navegacion" aria-label="Secciones">
    <ul>
      <li><a href="#jardin" data-nav="jardin">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-flor"/></svg>
        <span data-texto="nav.jardin"></span></a></li>
      <li><a href="#cartas" data-nav="cartas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-sobre"/></svg>
        <span data-texto="nav.cartas"></span></a></li>
      <li><a href="#juegos" data-nav="juegos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-juego"/></svg>
        <span data-texto="nav.juegos"></span></a></li>
    </ul>
  </nav>

  <!-- Tarjeta de recuerdo (la llena js/tarjeta.js) -->
  <dialog class="tarjeta" data-tarjeta aria-labelledby="tarjeta-titulo">
    <button class="tarjeta__cerrar" type="button" data-accion="cerrar" data-texto-aria="tarjeta.cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-cerrar"/></svg>
    </button>
    <article class="tarjeta__papel" data-papel>
      <figure class="tarjeta__polaroid">
        <div class="tarjeta__foto" data-foto></div>
        <figcaption class="manuscrita" data-pie></figcaption>
      </figure>
      <p class="tarjeta__fecha" data-fecha></p>
      <h2 id="tarjeta-titulo" data-titulo></h2>
      <div class="tarjeta__texto" data-cuerpo></div>
    </article>
    <div class="tarjeta__pasos" data-pasos>
      <button class="boton-redondo" type="button" data-accion="anterior" data-texto-aria="tarjeta.anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true" style="transform:scaleX(-1)"><use href="#ico-flecha"/></svg>
      </button>
      <span class="manuscrita" data-posicion aria-live="polite"></span>
      <button class="boton-redondo" type="button" data-accion="siguiente" data-texto-aria="tarjeta.siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-flecha"/></svg>
      </button>
    </div>
  </dialog>

  <!-- Carta abierta (la llena js/cartas.js) -->
  <dialog class="tarjeta carta" data-carta aria-labelledby="carta-titulo">
    <button class="tarjeta__cerrar" type="button" data-accion="cerrar" data-texto-aria="cartas.cerrar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-cerrar"/></svg>
    </button>
    <article class="tarjeta__papel carta__papel" data-papel>
      <p class="tarjeta__fecha" data-fecha></p>
      <h2 id="carta-titulo" data-titulo></h2>
      <div class="carta__texto" data-cuerpo></div>
      <p class="carta__firma manuscrita" data-firma></p>
    </article>
  </dialog>

  <div class="aviso" role="alert" data-aviso hidden></div>

  <!-- Íconos y dibujos reutilizables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="ico-brote" viewBox="0 0 40 48">
      <path d="M20 46 C20 36 19.5 28 21 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M20.6 28 C12 28 7 22 6 15 C14 15 20 20 20.6 28Z" fill="currentColor"/>
      <path d="M21 21 C28 20 33 14 34 7 C26 8 21.5 13 21 21Z" fill="currentColor"/>
    </symbol>
    <symbol id="ico-flor" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5.2" r="2.5"/><circle cx="15.8" cy="9" r="2.5"/>
        <circle cx="12" cy="12.8" r="2.5"/><circle cx="8.2" cy="9" r="2.5"/>
        <path d="M12 15.3V21.5M12 18.5c1.6-1.8 3.4-2.3 5-2"/>
      </g>
      <circle cx="12" cy="9" r="1.4" fill="currentColor"/>
    </symbol>
    <symbol id="ico-sobre" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5.5" width="18" height="13.5" rx="2.2"/>
        <path d="M3.6 7 12 13.2 20.4 7"/>
      </g>
      <circle cx="12" cy="15.6" r="1.6" fill="currentColor"/>
    </symbol>
    <symbol id="ico-juego" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8" transform="rotate(-6 12 12)"/>
      <g fill="currentColor"><circle cx="8.8" cy="9.2" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="15.2" cy="14.8" r="1.4"/></g>
    </symbol>
    <symbol id="ico-disco" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.5" fill="#0d0b0a" stroke="#b8ad97" stroke-width="1"/>
      <circle cx="12" cy="12" r="8" fill="none" stroke="#3a3229" stroke-width=".8"/>
      <circle cx="12" cy="12" r="6" fill="none" stroke="#3a3229" stroke-width=".8"/>
      <path d="M6.2 8.4a7 7 0 0 1 3.6-3" fill="none" stroke="#b8ad97" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
      <circle cx="12" cy="12" r="3.4" fill="#f2c84b"/>
      <circle cx="12" cy="12" r=".9" fill="#14110f"/>
    </symbol>
    <symbol id="ico-candado" viewBox="0 0 24 24">
      <path d="M8.3 11V8.2a3.7 3.7 0 0 1 7.4 0V11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="5.5" y="10.5" width="13" height="10" rx="2.4" fill="currentColor"/>
      <circle cx="12" cy="15" r="1.5" fill="#f1e6cc"/>
    </symbol>
    <symbol id="ico-cerrar" viewBox="0 0 24 24">
      <path d="M6.5 6.8c3.6 3.2 7.4 7 11 10.6M17.3 6.4c-3.4 3.8-7 7.4-10.8 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-flecha" viewBox="0 0 24 24">
      <path d="M4.5 12.4c4.8-.5 9.6-.3 14.5 0M13.8 6.6c1.8 2 3.6 3.8 5.4 5.6-1.9 1.8-3.7 3.6-5.6 5.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Flores del jardín (cabezas). viewBox centrado en 0,0 -->
    <symbol id="flor-margarita" viewBox="-30 -30 60 60">
      <g fill="#fbf6ea" stroke="#d8cdb4" stroke-width=".8">
        <ellipse cy="-14" rx="5" ry="12"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(30)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(60)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(90)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(120)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(150)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(180)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(210)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(240)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(270)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(300)"/>
        <ellipse cy="-14" rx="5" ry="12" transform="rotate(330)"/>
      </g>
      <circle r="7" fill="#f2c84b"/>
      <circle r="7" fill="none" stroke="#c99a2e" stroke-width="1.4" stroke-dasharray="1.5 2.5"/>
    </symbol>
    <symbol id="flor-jazmin" viewBox="-30 -30 60 60">
      <g fill="#fbf6ea" stroke="#d8cdb4" stroke-width=".8">
        <path d="M0 0C7-5 11-15 5-25C-2-20-5-9 0 0Z"/>
        <path d="M0 0C7-5 11-15 5-25C-2-20-5-9 0 0Z" transform="rotate(72)"/>
        <path d="M0 0C7-5 11-15 5-25C-2-20-5-9 0 0Z" transform="rotate(144)"/>
        <path d="M0 0C7-5 11-15 5-25C-2-20-5-9 0 0Z" transform="rotate(216)"/>
        <path d="M0 0C7-5 11-15 5-25C-2-20-5-9 0 0Z" transform="rotate(288)"/>
      </g>
      <circle r="3.2" fill="#f8df93"/>
    </symbol>
    <symbol id="flor-aromo" viewBox="-30 -30 60 60">
      <g fill="#f2c84b">
        <circle cx="0" cy="0" r="8.5"/><circle cx="-11" cy="-6" r="7"/><circle cx="10" cy="-7" r="7.5"/>
        <circle cx="-8" cy="9" r="6.5"/><circle cx="9" cy="9" r="6.5"/><circle cx="0" cy="-15" r="6"/>
        <circle cx="-17" cy="5" r="5"/><circle cx="17" cy="3" r="5"/><circle cx="1" cy="16" r="5.5"/>
      </g>
      <g fill="#f8df93">
        <circle cx="-2" cy="-3" r="3"/><circle cx="-13" cy="-8" r="2.4"/><circle cx="8" cy="-10" r="2.6"/>
        <circle cx="-10" cy="7" r="2.2"/><circle cx="7" cy="6" r="2.2"/><circle cx="-2" cy="-17" r="2"/>
      </g>
    </symbol>
    <symbol id="flor-calendula" viewBox="-30 -30 60 60">
      <g fill="#eeac34">
        <ellipse cy="-15" rx="4.6" ry="12"/><ellipse cy="-15" rx="4.6" ry="12" transform="rotate(24)"/>
        <ellipse cy="-15" rx="4.6" ry="12" transform="rotate(48)"/><ellipse cy="-15" rx="4.6" ry="12" transform="rotate(72)"/>
        <ellipse cy="-15" rx="4.6" ry="12" transform="rotate(96)"/><ellipse cy="-15" rx="4.6" ry="12" transform="rotate(120)"/>
        <ellipse cy="-15" rx="4.6" ry="12" transform="rotate(144)"/><ellipse cy="-15" rx="4.6" ry="12" transform="rotate(168)"/>
        <ellipse cy="-15" rx="4.6" ry="12" transform="rotate(192)"/><ellipse cy="-15" rx="4.6" ry="12" transform="rotate(216)"/>
        <ellipse cy="-15" rx="4.6" ry="12" transform="rotate(240)"/><ellipse cy="-15" rx="4.6" ry="12" transform="rotate(264)"/>
        <ellipse cy="-15" rx="4.6" ry="12" transform="rotate(288)"/><ellipse cy="-15" rx="4.6" ry="12" transform="rotate(312)"/>
        <ellipse cy="-15" rx="4.6" ry="12" transform="rotate(336)"/>
      </g>
      <g fill="#f2c84b">
        <ellipse cy="-9" rx="3.6" ry="8" transform="rotate(12)"/><ellipse cy="-9" rx="3.6" ry="8" transform="rotate(52)"/>
        <ellipse cy="-9" rx="3.6" ry="8" transform="rotate(92)"/><ellipse cy="-9" rx="3.6" ry="8" transform="rotate(132)"/>
        <ellipse cy="-9" rx="3.6" ry="8" transform="rotate(172)"/><ellipse cy="-9" rx="3.6" ry="8" transform="rotate(212)"/>
        <ellipse cy="-9" rx="3.6" ry="8" transform="rotate(252)"/><ellipse cy="-9" rx="3.6" ry="8" transform="rotate(292)"/>
        <ellipse cy="-9" rx="3.6" ry="8" transform="rotate(332)"/>
      </g>
      <circle r="5" fill="#7a4f0e"/>
    </symbol>
  </svg>

  <template id="tpl-margarita">
    <svg class="margarita-tinta" viewBox="0 0 120 150" aria-hidden="true">
      <path class="tallo" d="M60 82 C58 105 62 125 58 146 M60 118 C70 108 82 106 90 110 C82 120 70 122 60 118Z"/>
      <g class="petalos">
        <ellipse cx="60" cy="30" rx="9" ry="22"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(36 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(72 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(108 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(144 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(180 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(216 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(252 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(288 60 60)"/>
        <ellipse cx="60" cy="30" rx="9" ry="22" transform="rotate(324 60 60)"/>
      </g>
      <circle class="centro" cx="60" cy="60" r="13"/>
    </svg>
  </template>
</body>
</html>
